services:
  sched-share:
    build: .
    image: sched-share:latest
    container_name: sched-share
    user: "${SCHED_UID:-1000}:${SCHED_GID:-1000}"
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PORT: 8795
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8795:8795"
    volumes:
      - ./data:/data
