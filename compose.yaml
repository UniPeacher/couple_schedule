services:
  sched-share:
    build: .
    image: sched-share:latest
    container_name: sched-share
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=8795
      - DATA_DIR=/data
    ports:
      - "127.0.0.1:8795:8795"
    volumes:
      - ./data:/data
      - ./app.py:/app/app.py
      - ./special_days.py:/app/special_days.py
      - ./cycle.py:/app/cycle.py
      - ./cycle_collaboration.py:/app/cycle_collaboration.py
      - ./cycle_engine.py:/app/cycle_engine.py
      - ./cycle2.py:/app/cycle2.py
      - ./cycle2_collaboration.py:/app/cycle2_collaboration.py
      - ./cycle2.js:/app/cycle2.js
      - ./cycle2.css:/app/cycle2.css
      - ./settings_service.py:/app/settings_service.py
      - ./settings_ui.js:/app/settings_ui.js
      - ./settings_ui.css:/app/settings_ui.css
      - ./app.js:/app/app.js
      - ./app.css:/app/app.css
      - ./manifest.webmanifest:/app/manifest.webmanifest
      - ./sw.js:/app/sw.js
      - ./template_page.html:/app/template_page.html
      - ./notices.py:/app/notices.py
      - ./trips.py:/app/trips.py
      - ./images.py:/app/images.py
      - ./dog-couple.png:/app/dog-couple.png
      - ./dog-couple.webp:/app/dog-couple.webp
      - ./dog-set.webp:/app/dog-set.webp
      - ./dogrest.webp:/app/dogrest.webp
      - ./dog-walk1.webp:/app/dog-walk1.webp
      - ./dog-walk2.webp:/app/dog-walk2.webp
      - ./dog-walk3.webp:/app/dog-walk3.webp
      - ./dog-walk4.webp:/app/dog-walk4.webp
